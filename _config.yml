title: "Hi I'm Yiming Yin"
description: "Class of 2028"
owner_name: Yiming Yin
github_username: YimingYin1213
github_repo: "student"
baseurl: "/student"
future: true

# Apply the Uni theme for a galaxy-inspired design
remote_theme: jekyll-theme-uni

# Optional: Customize colors for a cosmic feel
background_color: "#0d0d0d"  # Deep space black
text_color: "#ffffff"        # Bright white text
link_color: "#ff6600"        # Nebula orange for links

# Social links
social_links:
  - { platform: github, user_url: "https://github.com/open-coding-society" }
  - { platform: x, user_url: "https://x.com/Open_Coding" }
  - { platform: youtube, user_url: "https://www.youtube.com/@OpenCodingSociety" }

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# Header pages
header_pages:
  - navigation/blog.md
  - navigation/search.md
  - navigation/about.md
  - navigation/logintoolkit.md

# Optional: Include custom CSS for additional styling
include:
  - assets/css/custom.css
